services:
  gateway:
    build:
      context: ..
      dockerfile: infra/chat-gateway.Dockerfile
    container_name: shardup_chat_gateway
    restart: unless-stopped
    env_file:
      - /etc/shardup-chat.env
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
